<!DOCTYPE html>
<html>
<head>
    <title>Parking Settings - Modern Parking System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>Modern Parking System</h1>
    <p>Parking Settings</p>
</header>

<main>

    <div class="form-card">

        <h2>Change Parking Rate</h2>

        {% if message %}
            <div class="success">
                {{ message }}
            </div>
        {% endif %}

        <p>
            Current parking rate:
            <strong>KSh {{ parking_rate }} per hour</strong>
        </p>

        <form method="POST">

            <label for="parking_rate">
                New Parking Rate (KSh per hour)
            </label>

            <input
                type="number"
                id="parking_rate"
                name="parking_rate"
                min="1"
                step="0.01"
                value="{{ parking_rate }}"
                required
            >

            <button type="submit" class="button">
                Update Parking Rate
            </button>

        </form>

        <a href="/" class="back-link">
            ← Back to Home
        </a>

    </div>

</main>

</body>
</html>
